<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIV SELECTORS</title>
    <link rel="stylesheet" href="div.css" />
    <style>
        div {
            border: 1px solid black;
            padding: 16px;
            margin: 16px;
            height: 120px;
            width: 300px;
            text-align: center;
            background-color: blueviolet;
        }

        .main {
            background-color: lightblue;
            color: navy;
            text-align: center;
        }

        #joy {
            background-color: lightgreen;
            color: darkgreen;
            font-style: italic;
        }

        .main h1 {
            text-transform: uppercase;
        }

        #joy p {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div>
        <h1>introduction</h1>
        <p>this is a introduction part</p>
    </div>
    <div class="main">
        <h1>you are intrested in?</h1>
        <p class="food">football description.............</p>
    </div>
    <div id="joy">
        <h1>Nepal</h1>
        <p>beauty of world</p>
    </div>
    
</body>
</html>
