<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Profile</title>
  <link rel="stylesheet" href="./stprofile.css" />
  <style>
    body {
      background-color: #f4f4f4;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    .main {
      max-width: 700px;
      margin: 40px auto;
      background-color: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.1);
    }

    .page-title {
      color: brown;
      text-align: center;
      font-family: Georgia, 'Times New Roman', Times, serif;
      font-size: 2.2rem;
    }

    .student-info {
      color: blueviolet;
      font-size: 1.1rem;
      margin: 15px 0;
      text-align: left;
    }

    .description {
      background-color: #efe8ff;
      padding: 15px;
      border-left: 5px solid #6a1b9a;
      font-size: 1.05rem;
      text-align: justify;
    }

    .external-style {
      color: #4b0082;
      font-size: 1.1em;
      background-color: #f5f5f5;
    }
  </style>
</head>
<body>
  <div class="main">
    <h1 class="page-title">STUDENT PROFILE</h1>

    <h2 class="student-info external-style">Student Name: <span style="color: #2e4057;">Rishikesh Dahal</span></h2>
    <h2 class="student-info external-style">Student ID: <span style="color: #2e4057;">2024001</span></h2>
    <h2 class="student-info external-style">Programme: <span style="color: #2e4057;">Software Engineering</span></h2>

    <div class="description" style="color: #3d2b1f; background-color: #f8e7d8; text-align: justify;">
      <p>I am a software engineering student interested in learning programming, web development, and new technologies.</p>
    </div>
  </div>
</body>
</html>
